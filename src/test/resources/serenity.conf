serenity {
  project.name = "LMS Automation Framework"
  take.screenshots = FOR_FAILURES
  report.encoding = "UTF-8"
  compress.filenames = true
}

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    "goog:chromeOptions" {
      args = [
        "--start-maximized",
        "--remote-allow-origins=*",
        "--no-sandbox",
        "--disable-dev-shm-usage",
        "--disable-gpu"
      ]
    }
  }
}

# Parallel Execution Configuration
junit.platform.execution.parallel.enabled = true
junit.platform.execution.parallel.mode.default = concurrent
junit.platform.execution.parallel.mode.classes.default = concurrent
junit.platform.execution.parallel.config.strategy = fixed
junit.platform.execution.parallel.config.fixed.parallelism = 3