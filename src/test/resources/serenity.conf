serenity {
  project.name = "LMS Automation Framework"
  take.screenshots = FOR_FAILURES
  report.encoding = "UTF-8"
  compress.filenames = true
}

# Base Moodle Properties
moodle {
  base.url = "https://sandbox51.moodledemo.net"
  api.token = "a35e9cda6bdefa4a7e6cf25d49e7e873"
  api.user.id = "4"
}

# Explicit URL Mappings for Driver & REST Assured
webdriver.base.url = "https://sandbox51.moodledemo.net"
rest.api.base.url = "https://sandbox51.moodledemo.net"

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    "goog:chromeOptions" {
      args = [
        "--start-maximized",
        "--remote-allow-origins=*",
        "--no-sandbox",
        "--disable-dev-shm-usage",
        "--disable-gpu"
      ]
    }
  }
}